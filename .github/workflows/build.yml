name: Kernel Build

on:
  workflow_dispatch:
    inputs:

      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        default: "https://github.com/4cko/caf_msm-5.15.git"

      kernelBranch:
        description: "Kernel branch"
        required: true
        default: "Miku"

      kernelDevice:
        description: "Kernel device"
        required: true
        default: "gki"

      localVersion:
        description: "Kernel localversion"
        required: true
        default: "-Miku"

      buildKSU:
        description: "KernelSU"
        required: true
        type: choice
        options:
          - vanilla
          - ksu
          - all
        default: "ksu"

      tickRate:
        description: "Kernel tick rate"
        required: true
        type: choice
        options:
          - default
          - 100
          - 250
          - 300
          - 1000
        default: "default"

      optimizationLevel:
        description: "Compiler optimization"
        required: true
        type: choice
        options:
          - default
          - O2
          - O3
          - Os
        default: "default"

      buildToolchain:
        description: "Toolchain"
        required: true
        type: choice
        options:
          - android-tools
          - custom-tools
        default: "android-tools"

      ltoType:
        description: "LTO type"
        required: true
        type: choice
        options:
          - thin
          - full
        default: "thin"

      updateKernel:
        description: "Update Android 13 5.15 patches"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

      androidKernelTag:
        description: "Android Common kernel tag"
        required: true
        default: "android13-5.15.211_r00"

  push:
    branches:
      - main

jobs:

  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/mydapitt/deb:12

    permissions:
      contents: write

    env:
      TZ: Asia/Jakarta
      KERNEL_DIR: ${{ github.workspace }}/common
      CLANG_VERSION: r547379
      ANDROID_COMMON_REPO: https://android.googlesource.com/kernel/common.git

    steps:

      # ============================================================
      # CHECKOUT WORKSPACE
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            make \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git config --global advice.detachedHead false
          git config --global advice.diverging false

          git --version
          clang --version
          ld.lld --version


      # ============================================================
      # INSTALL REPO TOOL
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" --version


      # ============================================================
      # DOWNLOAD ANDROID KERNEL BUILD ENVIRONMENT
      # ============================================================

      - name: Initialize Android 13 kernel manifest
        shell: bash
        run: |
          set -eux

          mkdir -p "${GITHUB_WORKSPACE}/android"

          cd "${GITHUB_WORKSPACE}/android"

          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android13-5.15

          repo sync \
            -c \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            -j"$(nproc --all)"


      # ============================================================
      # DOWNLOAD CLANG
      # ============================================================

      - name: Download Android Clang
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          mkdir -p prebuilts/clang/host/linux-x86

          if [ ! -d "prebuilts/clang/host/linux-x86/clang-${CLANG_VERSION}" ]; then

            wget -q \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-${CLANG_VERSION}.tar.gz" \
              -O clang.tar.gz

            tar -xzf clang.tar.gz \
              -C prebuilts/clang/host/linux-x86

            rm -f clang.tar.gz

          fi

          ls -lah prebuilts/clang/host/linux-x86


      # ============================================================
      # REMOVE ANDROID COMMON SOURCE
      # ============================================================

      - name: Replace Android Common source with CAF kernel
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          rm -rf common

          git clone \
            --branch "${{ inputs.kernelBranch }}" \
            --single-branch \
            "${{ inputs.kernelSourceURL }}" \
            common

          cd common

          echo "Kernel source:"
          git remote -v

          echo
          echo "Current commit:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          make kernelversion || true


      # ============================================================
      # PREPARE KERNEL GIT
      # ============================================================

      - name: Prepare kernel git repository
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android/common"

          git fetch --unshallow 2>/dev/null || true

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "Current branch:"
          git branch --show-current

          echo
          echo "Current commit:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' Makefile


      # ============================================================
      # ANDROID 13 5.15 UPDATE
      #
      # IMPORTANT:
      # Do NOT blindly merge the entire android13-5.15 branch.
      #
      # We first determine whether Android Common shares history
      # with the CAF kernel.
      #
      # If it does, we can safely perform a 3-way merge.
      #
      # If it does not, we DO NOT force the merge because doing so
      # can destroy CAF/vendor changes.
      # ============================================================

      - name: Update Android 13 5.15
        if: ${{ inputs.updateKernel == 'yes' }}
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}/android/common"

          TARGET_TAG="${{ inputs.androidKernelTag }}"

          echo "============================================================"
          echo " Android 13 5.15 kernel update"
          echo "============================================================"
          echo
          echo "Target:"
          echo "${TARGET_TAG}"
          echo

          CURRENT_VERSION=$(sed -n 's/^VERSION = //p' Makefile)
          CURRENT_PATCHLEVEL=$(sed -n 's/^PATCHLEVEL = //p' Makefile)
          CURRENT_SUBLEVEL=$(sed -n 's/^SUBLEVEL = //p' Makefile)

          CURRENT="${CURRENT_VERSION}.${CURRENT_PATCHLEVEL}.${CURRENT_SUBLEVEL}"

          echo "Current kernel:"
          echo "${CURRENT}"

          echo
          echo "Fetching Android Common..."

          if git remote get-url android-common >/dev/null 2>&1; then
            git remote set-url android-common "${ANDROID_COMMON_REPO}"
          else
            git remote add android-common "${ANDROID_COMMON_REPO}"
          fi

          git fetch \
            --no-tags \
            --filter=blob:none \
            android-common \
            "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}"

          echo
          echo "Android Common target:"
          git show -s \
            --format='%H%n%ad%n%s' \
            --date=iso \
            "refs/tags/${TARGET_TAG}"

          TARGET_SUBLEVEL=$(
            git show "refs/tags/${TARGET_TAG}:Makefile" |
            sed -n 's/^SUBLEVEL = //p'
          )

          echo
          echo "Current sublevel : ${CURRENT_SUBLEVEL}"
          echo "Target sublevel  : ${TARGET_SUBLEVEL}"

          if [ "${CURRENT_SUBLEVEL}" -ge "${TARGET_SUBLEVEL}" ]; then
            echo
            echo "Kernel is already at or newer than target."
            echo "Skipping update."
            exit 0
          fi

          echo
          echo "Checking Git ancestry..."

          COMMON_BASE=$(
            git merge-base HEAD "refs/tags/${TARGET_TAG}" || true
          )

          if [ -z "${COMMON_BASE}" ]; then

            echo
            echo "============================================================"
            echo " WARNING"
            echo "============================================================"
            echo
            echo "CAF/Miku and Android Common do not share a usable"
            echo "Git ancestry."
            echo
            echo "A direct merge would be unsafe and can overwrite"
            echo "CAF/vendor-specific code."
            echo
            echo "The kernel source will NOT be modified."
            echo
            echo "For this reason the automatic Android Common merge"
            echo "has been skipped."
            echo
            echo "============================================================"

            exit 0
          fi

          echo
          echo "Common base:"
          echo "${COMMON_BASE}"

          echo
          echo "Commits between common base and Android target:"
          git rev-list \
            --count \
            "${COMMON_BASE}..refs/tags/${TARGET_TAG}"

          echo
          echo "Creating temporary branch..."

          BACKUP_BRANCH="pre-android-update-${GITHUB_RUN_ID}"

          git branch "${BACKUP_BRANCH}" HEAD

          echo
          echo "Attempting 3-way merge..."

          set +e

          git merge \
            --no-ff \
            --no-edit \
            --no-commit \
            "refs/tags/${TARGET_TAG}"

          MERGE_STATUS=$?

          set -e

          if [ "${MERGE_STATUS}" -ne 0 ]; then

            echo
            echo "============================================================"
            echo " Android Common merge failed"
            echo "============================================================"

            echo
            echo "Merge status:"
            echo "${MERGE_STATUS}"

            echo
            echo "Conflicted files:"
            git diff \
              --name-only \
              --diff-filter=U || true

            echo
            echo "Conflict count:"
            git diff \
              --name-only \
              --diff-filter=U |
              wc -l || true

            echo
            echo "Git status:"
            git status --short || true

            echo
            echo "Recent commits:"
            git log --oneline -10 || true

            echo
            echo "Aborting merge..."

            git merge --abort || true

            echo
            echo "Restoring original HEAD..."

            git reset --hard "${BACKUP_BRANCH}"

            git branch -D "${BACKUP_BRANCH}" || true

            echo
            echo "The kernel was NOT modified."

            exit 1
          fi

          echo
          echo "Merge completed successfully."

          git commit \
            -m "Merge Android Common ${TARGET_TAG}"

          git branch -D "${BACKUP_BRANCH}" || true

          echo
          echo "Updated kernel version:"
          make kernelversion

          echo
          echo "Latest commit:"
          git log -1 --oneline


      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Integrate KernelSU-Next
        if: ${{ inputs.buildKSU != 'vanilla' }}
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android/common"

          echo "Installing KernelSU-Next..."

          git clone \
            --depth=1 \
            --branch=dev-susfs \
            https://github.com/pershoot/KernelSU-Next.git \
            KernelSU-Next

          if [ -f KernelSU-Next/kernel/setup.sh ]; then
            bash KernelSU-Next/kernel/setup.sh
          fi

          if [ -d KernelSU-Next/kernel ]; then
            ln -sf \
              "${GITHUB_WORKSPACE}/android/common/KernelSU-Next/kernel" \
              "${GITHUB_WORKSPACE}/android/common/drivers/kernelsu"
          fi

          echo
          echo "KernelSU directory:"
          ls -lah drivers/kernelsu || true


      # ============================================================
      # SUSFS
      # ============================================================

      - name: Integrate SUSFS
        if: ${{ inputs.buildKSU != 'vanilla' }}
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android/common"

          echo "Downloading SUSFS..."

          git clone \
            --depth=1 \
            --branch=gki-android13-5.15 \
            https://github.com/ShirkNeko/SUSFS.git \
            susfs4ksu

          SUSFS_DIR="${GITHUB_WORKSPACE}/android/common/susfs4ksu"

          echo
          echo "SUSFS directory:"
          ls -lah "${SUSFS_DIR}"

          if [ -d "${SUSFS_DIR}/kernel_patches/fs" ]; then

            cp -fv \
              "${SUSFS_DIR}/kernel_patches/fs/susfs.c" \
              fs/susfs.c

          elif [ -f "${SUSFS_DIR}/fs/susfs.c" ]; then

            cp -fv \
              "${SUSFS_DIR}/fs/susfs.c" \
              fs/susfs.c

          fi

          if [ -d "${SUSFS_DIR}/kernel_patches/include/linux" ]; then

            mkdir -p include/linux

            cp -fv \
              "${SUSFS_DIR}/kernel_patches/include/linux/"* \
              include/linux/ || true

          fi

          PATCH_FILE=$(
            find "${SUSFS_DIR}" \
              -type f \
              -name "50_add_susfs_in_gki-android13-5.15.patch" |
            head -n 1
          )

          if [ -n "${PATCH_FILE}" ]; then

            echo
            echo "Applying SUSFS patch:"
            echo "${PATCH_FILE}"

            git apply \
              --3way \
              "${PATCH_FILE}"

          else

            echo
            echo "SUSFS patch was not found."

          fi


      # ============================================================
      # CONFIGURATION
      # ============================================================

      - name: Configure kernel
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android/common"

          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          echo "Using:"
          echo "${DEFCONFIG}"

          test -f "${DEFCONFIG}"

          # --------------------------------------------------------
          # LOCALVERSION
          # --------------------------------------------------------

          if grep -q '^CONFIG_LOCALVERSION=' "${DEFCONFIG}"; then

            sed -i \
              "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"${{ inputs.localVersion }}\"/" \
              "${DEFCONFIG}"

          else

            echo \
              "CONFIG_LOCALVERSION=\"${{ inputs.localVersion }}\"" \
              >> "${DEFCONFIG}"

          fi


          # --------------------------------------------------------
          # LTO
          # --------------------------------------------------------

          sed -i \
            -e '/CONFIG_LTO_CLANG_THIN/d' \
            -e '/CONFIG_LTO_CLANG_FULL/d' \
            -e '/CONFIG_LTO_CLANG_NONE/d' \
            "${DEFCONFIG}"

          case "${{ inputs.ltoType }}" in

            thin)
              echo "CONFIG_LTO_CLANG=y" >> "${DEFCONFIG}"
              echo "CONFIG_LTO_CLANG_THIN=y" >> "${DEFCONFIG}"
              ;;

            full)
              echo "CONFIG_LTO_CLANG=y" >> "${DEFCONFIG}"
              echo "CONFIG_LTO_CLANG_FULL=y" >> "${DEFCONFIG}"
              ;;

          esac


          # --------------------------------------------------------
          # OPTIMIZATION
          # --------------------------------------------------------

          case "${{ inputs.optimizationLevel }}" in

            O2)
              sed -i \
                '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' \
                "${DEFCONFIG}"

              echo \
                "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" \
                >> "${DEFCONFIG}"
              ;;

            O3)
              sed -i \
                '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' \
                "${DEFCONFIG}"

              echo \
                "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" \
                >> "${DEFCONFIG}"

              export KCFLAGS="-O3"
              ;;

            Os)
              sed -i \
                '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' \
                "${DEFCONFIG}"

              echo \
                "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" \
                >> "${DEFCONFIG}"
              ;;

          esac


          # --------------------------------------------------------
          # HZ
          # --------------------------------------------------------

          case "${{ inputs.tickRate }}" in

            100)
              sed -i '/CONFIG_HZ=/d' "${DEFCONFIG}"
              echo "CONFIG_HZ_100=y" >> "${DEFCONFIG}"
              ;;

            250)
              sed -i '/CONFIG_HZ=/d' "${DEFCONFIG}"
              echo "CONFIG_HZ_250=y" >> "${DEFCONFIG}"
              ;;

            300)
              sed -i '/CONFIG_HZ=/d' "${DEFCONFIG}"
              echo "CONFIG_HZ_300=y" >> "${DEFCONFIG}"
              ;;

            1000)
              sed -i '/CONFIG_HZ=/d' "${DEFCONFIG}"
              echo "CONFIG_HZ_1000=y" >> "${DEFCONFIG}"
              ;;

          esac


          # --------------------------------------------------------
          # KSU
          # --------------------------------------------------------

          if [ "${{ inputs.buildKSU }}" != "vanilla" ]; then

            echo "CONFIG_KSU=y" >> "${DEFCONFIG}"

            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "${DEFCONFIG}"

            echo "CONFIG_KSU_WITH_KPROBES=y" >> "${DEFCONFIG}"

            echo "CONFIG_KSU_SUSFS=y" >> "${DEFCONFIG}"

          fi


          # --------------------------------------------------------
          # SUSFS
          # --------------------------------------------------------

          if [ "${{ inputs.buildKSU }}" != "vanilla" ]; then

            echo "CONFIG_KSU_SUSFS=y" >> "${DEFCONFIG}"

            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "${DEFCONFIG}"

            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "${DEFCONFIG}"

            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "${DEFCONFIG}"

            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "${DEFCONFIG}"

          fi


          echo
          echo "Final GKI defconfig additions:"
          tail -40 "${DEFCONFIG}"


      # ============================================================
      # CLEAN CONFIG
      # ============================================================

      - name: Validate kernel configuration
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          export BUILD_CONFIG=common/build.config.gki.aarch64

          make \
            -C common \
            O=out \
            gki_defconfig

          if [ -f out/.config ]; then

            echo
            echo "Kernel configuration generated successfully."

            grep -E \
              'CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_LTO|CONFIG_HZ_' \
              out/.config || true

          fi


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}/android"

          export BUILD_CONFIG=common/build.config.gki.aarch64

          export OUT_DIR="${GITHUB_WORKSPACE}/android/out"

          export PATH="${GITHUB_WORKSPACE}/android/prebuilts/clang/host/linux-x86/clang-${CLANG_VERSION}/bin:${PATH}"

          export LLVM=1
          export LLVM_IAS=1

          if [ "${{ inputs.optimizationLevel }}" = "O3" ]; then
            export KCFLAGS="-O3"
          fi

          echo "============================================================"
          echo " Kernel build"
          echo "============================================================"

          echo
          echo "Kernel version:"
          make -C common kernelversion

          echo
          echo "Compiler:"
          clang --version

          echo
          echo "CPU:"
          nproc --all

          echo
          echo "Starting build..."

          BUILD_CONFIG="${BUILD_CONFIG}" \
          OUT_DIR="${OUT_DIR}" \
          build/build.sh \
            -j"$(nproc --all)"


      # ============================================================
      # FIND IMAGE
      # ============================================================

      - name: Find kernel Image
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          echo "Searching for Image..."

          find . \
            -type f \
            \( \
              -name Image \
              -o \
              -name Image.gz \
              -o \
              -name Image.lz4 \
            \) \
            -print

          IMAGE=$(find out -type f -name Image | head -n 1)

          if [ -z "${IMAGE}" ]; then

            echo "ERROR: Kernel Image not found."

            exit 1

          fi

          echo
          echo "Found:"
          echo "${IMAGE}"

          cp "${IMAGE}" \
            "${GITHUB_WORKSPACE}/Image"

          ls -lh \
            "${GITHUB_WORKSPACE}/Image"


      # ============================================================
      # ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf \
            AnyKernel3/.git \
            AnyKernel3/kernel/* \
            AnyKernel3/patch \
            AnyKernel3/ramdisk

          cp Image \
            AnyKernel3/Image

          echo
          echo "AnyKernel3 contents:"
          ls -lah AnyKernel3


      # ============================================================
      # CREATE ZIP
      # ============================================================

      - name: Package kernel
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/AnyKernel3"

          KERNEL_VERSION=$(
            "${GITHUB_WORKSPACE}/android/common/scripts/setlocalversion" \
              "${GITHUB_WORKSPACE}/android/common" 2>/dev/null ||
            true
          )

          DATE=$(date '+%Y%m%d-%H%M')

          ZIP_NAME="Kernel-${{ inputs.kernelBranch }}-${DATE}.zip"

          zip -r9 \
            "../${ZIP_NAME}" \
            . \
            -x "*.git*"

          echo
          echo "ZIP:"
          echo "${ZIP_NAME}"

          ls -lh \
            "../${ZIP_NAME}"


      # ============================================================
      # BUILD INFO
      # ============================================================

      - name: Generate build information
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}"

          {
            echo "Kernel Build"
            echo
            echo "Source: ${{ inputs.kernelSourceURL }}"
            echo "Branch: ${{ inputs.kernelBranch }}"
            echo "Device: ${{ inputs.kernelDevice }}"
            echo "Localversion: ${{ inputs.localVersion }}"
            echo "KernelSU: ${{ inputs.buildKSU }}"
            echo "Tick rate: ${{ inputs.tickRate }}"
            echo "Optimization: ${{ inputs.optimizationLevel }}"
            echo "LTO: ${{ inputs.ltoType }}"
            echo "Android Common: ${{ inputs.androidKernelTag }}"
            echo
            echo "Kernel version:"
            cd android/common
            make kernelversion
            echo
            echo "Commit:"
            git log -1 --oneline

          } > "${GITHUB_WORKSPACE}/build-info.txt"

          cat "${GITHUB_WORKSPACE}/build-info.txt"


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.kernelBranch }}
          path: |
            Image
            *.zip
            build-info.txt
          compression-level: 9


      # ============================================================
      # CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kernel-${{ inputs.kernelBranch }}-${{ github.run_number }}"
          name: "Kernel ${{ inputs.kernelBranch }} #${{ github.run_number }}"
          body: |
            ## Kernel Build

            **Source:** `${{ inputs.kernelSourceURL }}`
            **Branch:** `${{ inputs.kernelBranch }}`
            **Device:** `${{ inputs.kernelDevice }}`

            ### Configuration

            - KernelSU: `${{ inputs.buildKSU }}`
            - SUSFS: `${{ inputs.buildKSU != 'vanilla' }}`
            - Tick rate: `${{ inputs.tickRate }} Hz`
            - Optimization: `${{ inputs.optimizationLevel }}`
            - LTO: `${{ inputs.ltoType }}`
            - Android Common: `${{ inputs.androidKernelTag }}`

            Built automatically by GitHub Actions.
          files: |
            *.zip
            Image
            build-info.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
